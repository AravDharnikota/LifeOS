# fly launch --copy-config --no-deploy ; fly volumes create aravos_data --size 1 ; fly secrets set ANTHROPIC_API_KEY=... ARAVOS_TOKEN=... ; fly deploy
app = "aravos"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  ARAVOS_DATA_DIR = "/data"
  ARAVOS_TIMEZONE = "America/Los_Angeles"
  ARAVOS_PUBLIC_URL = "https://aravos.fly.dev"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "aravos_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
